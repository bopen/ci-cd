name: 'Custom Repo Cloner'
description: 'Clones a list of repositories using a specific syntax'
inputs:
  repo-list:
    description: 'The list of repos to clone'
    required: true
  git-pat:
    description: 'Git Personal Access Token for authentication'
    default: ''
    required: false
  default-repo-ref:
    description: 'Default Git reference to check out'
    default: 'main'
    required: false
  pyproject-path:
    description: 'Path to the pyproject.toml file'
    default: ''
    required: false
runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
    - name: Run cloning script
      shell: bash
      env:
        GIT_PAT: ${{ inputs.git-pat }}
        REPO_LIST: ${{ inputs.repo-list }}
        DEFAULT_REPO_REF: ${{ inputs.default-repo-ref }}
        PYPROJECT_PATH: ${{ inputs.pyproject-path }}
      run: |
        uv run ${{ github.action_path }}/../scripts/git-clone-ref.py ${REPO_LIST} --default-repo-ref ${DEFAULT_REPO_REF} --pyproject-path ${DEFAULT_REPO_REF}
