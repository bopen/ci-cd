name: Publish Helm Chart
description: 'Builds and publishes a Helm chart to Helm registry'
inputs:
  chartVersion:
    description: 'The version of the chart to build'
    required: true
    type: string
  repoName:
    description: 'The name of the repository'
    required: true
    type: string
  dockerRegistryUsername:
    description: 'The username for the helm registry'
    required: false
    type: string
  dockerRegistryAccessToken:
    description: 'The access token for the helm registry'
    required: false
    type: string
runs:
  using: "composite"
  steps:
    - name: Show inputs
      shell: bash
      run: |
        echo "chartVersion: ${{ inputs.chartVersion }}"
        echo "repoName: ${{ inputs.repoName }}"
        echo "dockerRegistryUsername: ${{ inputs.dockerRegistryUsername != '' && 'set' || 'empty' }}"
        echo "dockerRegistryAccessToken: ${{ inputs.dockerRegistryAccessToken != '' && 'set' || 'empty' }}"
    - name: Checkout chart-repo
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        repository: ${{ inputs.repoName }}
        fetch-depth: 0
    - name: set chart name
      id: set_chart_name
      shell: bash
      run: |
        echo "Setting chart name to: ${{ inputs.repoName }}"
        CHART_NAME=$(echo ${{ inputs.repoName }} | cut -d"-" -f 1,2)
        echo "chart-name=$CHART_NAME" >> $GITHUB_OUTPUT
    - name: Chart Build and Push
      uses: appany/helm-oci-chart-releaser@v0.5.0
      with:
        path: .
        name: ${{ steps.set_chart_name.outputs.chart-name }}
        tag: ${{ inputs.chartVersion }}
        registry: eccr.ecmwf.int
        repository: cads/helm
        registry_username: ${{ inputs.dockerRegistryUsername }}
        registry_password: ${{ inputs.dockerRegistryAccessToken }}