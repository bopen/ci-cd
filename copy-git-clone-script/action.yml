name: 'Copy Git Clone Script'
description: 'It copies the git clone script'
inputs:
  target-path:
    description: 'The directory where git-clone-ref.py should be copied'
    required: true
runs:
  using: "composite"
  steps:
    - name: Copy git clone script to ${{ inputs.target-path }}
      env:
        TARGET_PATH: ${{ inputs.target-path }}
      shell: bash
      run: |
        cp ${{ github.action_path }}/../src/ci_cd/git_clone_ref.py ${TARGET_PATH}/git-clone-ref.py
